# ============================================================
# Catiche — Docker Compose (infra de développement du monorepo)
# Le serveur et les apps tournent sur l'host : `bun run dev` (à la racine).
# Interface de la base : `bun run db:studio`.
# ============================================================

# Nom de projet Compose figé, indépendant du dossier : évite les conflits de
# conteneurs/volumes quand le compose (ou le dossier) change de nom.
name: catiche

services:
  # ===========================================
  # PostgreSQL 18
  # ===========================================
  postgres:
    image: postgres:18.6
    container_name: catiche-postgres-dev
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: catiche_dev
      POSTGRES_USER: catiche_dev
      POSTGRES_PASSWORD: catiche_dev_password
      # Performance tuning for dev
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - postgres_dev_data:/var/lib/postgresql
    networks:
      - catiche-dev
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U catiche_dev -d catiche_dev']
      interval: 10s
      timeout: 5s
      retries: 5
    # Performance config pour dev local
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
      -c max_connections=100

  # ===========================================
  # Navigateurs des suites e2e (Playwright Server)
  # ===========================================
  # Les tests tournent sur l'host et pilotent les navigateurs de l'image officielle, en local
  # comme en CI (https://playwright.dev/docs/docker). Le serveur est le Playwright que bun a
  # installé : sa version suit celle des tests, l'étiquette de l'image la suit avec Renovate.
  playwright:
    image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    container_name: catiche-playwright
    init: true
    ipc: host
    user: pwuser
    ports:
      - '127.0.0.1:3030:3030'
    volumes:
      - .:/repo:ro
    networks:
      - catiche-dev
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "require('net').connect(3030).on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
    command: node /repo/tooling/playwright-web/node_modules/@playwright/test/cli.js run-server --port 3030 --host 0.0.0.0

# ===========================================
# Volumes persistants
# ===========================================
volumes:
  postgres_dev_data:
    name: catiche_postgres_dev_data

# ===========================================
# Réseau isolé development
# ===========================================
networks:
  catiche-dev:
    name: catiche-dev-network
    driver: bridge
