# Self-hosted Renovate: a failed scheduled run notifies the cron author,
# unlike the hosted app that stopped silently in June 2026.
# https://github.com/renovatebot/github-action

name: Renovate

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          LOG_LEVEL: info
          # Renovate always logs the exit code a repo result maps to, but only
          # actually exits with it when this flag is set (docs.renovatebot.com/
          # self-hosted-configuration/#exitcodeforerrors) — otherwise a rejected
          # token ends the run with exit 0.
          RENOVATE_EXIT_CODE_FOR_ERRORS: 'true'
