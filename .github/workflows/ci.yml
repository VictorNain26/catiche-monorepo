# One pipeline: every check of the repository, in parallel jobs, gathered by `ci-ok`, the one
# check the ruleset requires; then, on main, the deployments. On a PR, turbo `--affected` picks the
# tasks; on main, all run. Actions pinned by SHA; each job gets only the permissions it uses, and
# no checkout keeps its token (https://docs.github.com/en/actions/reference/security/secure-use).

name: CI

# No paths-ignore: `ci-ok` must report on every PR, or the ruleset blocks its merge, and every
# commit on main gets its image. Every PR, whatever its base: in a cascade, each PR targets the
# branch before it, and the run on its head still counts once it is retargeted on main.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# A new push cancels a PR's run. On main, each commit has its own group: a group holds one running
# and one pending run, and a third merge would cancel the pending one, leaving a commit without
# its image (https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_SCM_BASE: origin/main
  # The PR runs what it affects, main runs everything.
  AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-monorepo
      - run: bunx --no-install turbo run typecheck lint lint:scripts ${AFFECTED:+"$AFFECTED"}
      - run: bunx --no-install prettier --check .
      # knip reads the server's declarations, which a PR that does not affect it has not built.
      - run: bunx --no-install turbo run build:types --filter=@repo/server
      - run: bunx --no-install knip --treat-config-hints-as-errors
      - run: bunx --no-install sherif
      # The image builds the server and the web; the landing builds here, so that a PR sees the
      # build its deployment would run.
      - run: bunx --no-install turbo run build --filter=landing ${AFFECTED:+"$AFFECTED"}
      # The landing's headers, redirections and error pages ship in its Caddyfile, which nothing
      # else reads before production: the Caddy Clever Cloud runs (2.11.4, `apps/landing/Caddyfile`)
      # adapts and provisions it here.
      - name: The Caddyfile is valid
        uses: docker://caddy@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b # 2.11.4-alpine
        with:
          entrypoint: caddy
          args: validate --config apps/landing/Caddyfile --adapter caddyfile
      - name: The committed SQL matches the schema
        working-directory: apps/server
        run: |
          bun run db:generate
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::Schema and migrations out of sync: run 'bun run db:generate' in apps/server and commit drizzle/."
            git status --porcelain drizzle/
            exit 1
          fi
      - name: The migrations are consistent
        working-directory: apps/server
        run: bun run db:check

  # actionlint checks the syntax, the expressions and the shell of every workflow; zizmor, their
  # security: injections, permissions, credentials, impostor commits (https://docs.zizmor.sh/audits/).
  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Docker image method of https://github.com/rhysd/actionlint/blob/main/docs/usage.md.
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
      # The action runs zizmor's image by digest.
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          config: .github/zizmor.yml
          advanced-security: false
          annotations: true

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # The server's tests run on a real Postgres: a database per test file, copied from this run's
    # template (apps/server/src/testing).
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-monorepo
      - run: bunx --no-install turbo run test ${AFFECTED:+"$AFFECTED"}
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  # The image is built once, run against Postgres, and published by its commit on main. On a PR,
  # only when the server or the web, which it serves, is affected. Its layers are cached in the
  # GitHub Actions cache (https://docs.docker.com/build/ci/github-actions/cache/).
  image:
    name: Server image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The package's name from before Catiche: Clever Cloud pulls it without credentials, which
      # needs it public, and a package under a new name starts private.
      IMAGE: ghcr.io/${{ github.repository_owner }}/tomai-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-monorepo
      # The web depends on the server: a change to either affects the web's build.
      - name: Is the server or the web affected
        id: affected
        run: |
          TASKS=$(bunx --no-install turbo run build --filter=web ${AFFECTED:+"$AFFECTED"} --dry=json | jq '[.tasks[] | select(.command != "<NONEXISTENT>")] | length')
          echo "run=$([ "$TASKS" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # A registry's names are lower case; the owner's may not be.
      - run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      # The docker-container driver, which the GitHub Actions cache needs. The runner is thrown
      # away after the job: removing the builder only cost ~20 s.
      - if: steps.affected.outputs.run == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false
      - name: Build
        if: steps.affected.outputs.run == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/server/Dockerfile
          target: production
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # NODE_ENV=test: the service's Postgres has no TLS, which production requires.
      - name: Run against Postgres
        if: steps.affected.outputs.run == 'true'
        run: |
          docker run -d --name server --network host \
            -e NODE_ENV=test -e PORT=3000 -e LOG_LEVEL=warn \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres \
            -e BETTER_AUTH_SECRET="$(openssl rand -base64 32)" -e BETTER_AUTH_URL=http://localhost:3000 \
            "$IMAGE:$GITHUB_SHA"
          # The image's HEALTHCHECK, then readiness: migrations applied, database reachable.
          for _ in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' server)" = healthy ] &&
              curl -sf http://localhost:3000/health/ready; then echo; exit 0; fi
            sleep 1
          done
          docker inspect -f '{{json .State.Health}}' server
          docker logs server
          exit 1
      - name: Publish
        id: publish
        if: steps.affected.outputs.run == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          echo "image=$(docker inspect -f '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

  # GitHub's own secret scanning and push protection cover the providers' patterns; gitleaks adds
  # the generic ones and the repository's rules (.gitleaks.toml), over the whole history.
  secrets:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Dependency audit (prod, high+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-monorepo
      - run: bun audit --audit-level=high --prod

  # The one required check. A job that needs another is skipped when that one fails, unless
  # always() runs it (https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/use-jobs):
  # it fails on any result but success.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [check, workflows, test, image, secrets, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then exit 1; fi
          done

  # The staging takes every merge on main once everything passed: the image the CI built and ran,
  # by its digest. Clever Cloud only pulls it, nothing is built there, so no secret reaches a build
  # (docs/architecture.md, « Environnements et livraison »). The keys are the staging environment's,
  # which only main may use. Rolling back is a revert merged on main, deployed like any merge.
  deploy-staging:
    name: Deploy staging
    needs: [ci-ok, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    environment:
      name: staging
      url: https://staging.tomia.fr
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      CLEVER_TOKEN: ${{ secrets.CLEVER_TOKEN }}
      CLEVER_SECRET: ${{ secrets.CLEVER_SECRET }}
      APP_ID: app_d529cc6c-ffcb-4cf4-9aef-09c68f93b42f
      IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - name: Deploy the image
        run: |
          # Runs on main are concurrent, and two merges close together can finish out of order:
          # only main's head deploys, so that an older image never replaces a newer one.
          head="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::$GITHUB_SHA is no longer main's head ($head): the run of the head deploys"
            exit 0
          fi
          mkdir release && cd release
          echo "FROM $IMAGE" > Dockerfile
          git init -q
          git add Dockerfile
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "$GITHUB_SHA"
          npx --yes clever-tools@5.1.0 link "$APP_ID"
          npx --yes clever-tools@5.1.0 deploy --force

  # The landing is production straight away (Victor, 2026-10-08): every merge on main, once everything
  # passed, as for the staging. Deploying only when a merge changes it would lose a change whose run is
  # overtaken by the next merge's. Clever Cloud's static runtime serves what the CI built, its Caddyfile
  # and dist/, with Caddy, and builds nothing (https://www.clever.cloud/developers/doc/deploy/applications/static/).
  deploy-landing:
    name: Deploy landing
    needs: [ci-ok]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: landing
      url: https://tomia.fr
    concurrency:
      group: deploy-landing
      cancel-in-progress: false
    env:
      CLEVER_TOKEN: ${{ secrets.CLEVER_TOKEN }}
      CLEVER_SECRET: ${{ secrets.CLEVER_SECRET }}
      APP_ID: app_abb69675-6703-41a7-a092-c847e01a57eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-monorepo
      - run: bunx --no-install turbo run build --filter=landing
      - name: Deploy the build
        run: |
          # As for the staging: only main's head deploys, so that an older build never replaces a newer one.
          head="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::$GITHUB_SHA is no longer main's head ($head): the run of the head deploys"
            exit 0
          fi
          mkdir release
          cp apps/landing/Caddyfile release/
          cp -r apps/landing/dist release/dist
          cd release
          git init -q
          git add Caddyfile dist
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "$GITHUB_SHA"
          npx --yes clever-tools@5.1.0 link "$APP_ID"
          npx --yes clever-tools@5.1.0 deploy --force
