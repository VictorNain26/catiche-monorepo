# Claude Code in the repository (https://code.claude.com/docs/en/github-actions): a review of each
# pull request, and an answer to `@claude` in a comment. Claude works from the checkout, so it
# follows CLAUDE.md and .claude/rules like a local session; the action restores them from the base
# branch, so a pull request cannot rewrite them for its own review. Not part of `ci-ok`: a review
# never blocks a merge.
#
# Authentication: Victor's Claude subscription (`CLAUDE_CODE_OAUTH_TOKEN`, from `claude setup-token`),
# no API billing. GitHub writes (comments, commits) go through the Claude GitHub App, whose token
# the action gets by OIDC (`id-token: write`); the workflow's own token only reads.
# Only same-repository pull requests and people with write access reach Claude: a fork's content
# never runs with the token (https://github.com/anthropics/claude-code-action/blob/main/docs/security.md).

name: Claude

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  # Once per pull request, not on every push: the review reads the whole change, and the
  # subscription's usage is shared with Victor's sessions. Renovate's are left out, it opens them
  # under Victor's account. `@claude review` asks for another.
  review:
    name: Claude review
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: The subscription token is set
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::The repository secret CLAUDE_CODE_OAUTH_TOKEN is missing: run 'claude setup-token' and add its token under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      # The code-review plugin posts its findings inline, or one comment when it finds none; the
      # action starts the inline-comment server only when --allowedTools names it.
      - id: claude
        uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029 # v1.0.239
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          prompt: /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          claude_args: --allowedTools "mcp__github_inline_comment__create_inline_comment"
      # The action ends in success without running Claude when this workflow differs from main's,
      # as on the pull request that changes it: a review that did not happen must not look green.
      - name: Claude reviewed
        if: steps.claude.outputs.conclusion != 'success'
        run: |
          echo "::error::Claude did not review this pull request: the action skipped it (a pull request that changes .github/workflows/claude.yml is reviewed only once the change is on main) or failed."
          exit 1

  # `@claude` in a comment, from someone with write access. Claude reads, edits and commits on the
  # pull request's branch, and the CI checks what it pushes; it runs no other command.
  respond:
    name: Claude
    if: >-
      github.event_name != 'pull_request' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association) &&
      contains(github.event.comment.body || github.event.review.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      # Lets Claude read the CI's results on the pull request.
      actions: read
      id-token: write
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: The subscription token is set
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::The repository secret CLAUDE_CODE_OAUTH_TOKEN is missing: run 'claude setup-token' and add its token under Settings > Secrets and variables > Actions."
            exit 1
          fi
      # A comment event runs with the repository's secrets whatever the pull request's origin.
      - name: The pull request is not from a fork
        if: github.event.issue.pull_request || github.event.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          if [ "$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json isCrossRepository --jq .isCrossRepository)" != false ]; then
            echo "::error::Pull request #$NUMBER comes from a fork: Claude does not run on it."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      # No --model: the subscription's default model, which follows Claude Code's releases.
      - uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029 # v1.0.239
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --max-turns 30
