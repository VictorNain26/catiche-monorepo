# Claude Code in the repository (https://code.claude.com/docs/en/github-actions): an answer to
# `@claude` in a comment, and nothing else. Every branch is already reviewed in a fresh context
# before its push (docs/architecture.md, "Environnements et livraison"); a second review on each
# pull request would spend the same subscription on work already reviewed. Claude works from the
# checkout, so it follows CLAUDE.md and .claude/rules like a local session. Not part of `ci-ok`.
#
# Authentication: Victor's Claude subscription (`CLAUDE_CODE_OAUTH_TOKEN`, from `claude setup-token`),
# no API billing. GitHub writes (comments, commits) go through the Claude GitHub App, whose token
# the action gets by OIDC (`id-token: write`); the workflow's own token only reads.
# Only same-repository pull requests and people with write access reach Claude: a fork's content
# never runs with the token (https://github.com/anthropics/claude-code-action/blob/main/docs/security.md).

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  # `@claude` in a comment, from someone with write access. Claude reads, edits and commits on the
  # pull request's branch, and the CI checks what it pushes; it runs no other command.
  respond:
    name: Claude
    if: >-
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association) &&
      contains(github.event.comment.body || github.event.review.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      # Lets Claude read the CI's results on the pull request.
      actions: read
      id-token: write
    # No concurrency group: a group keeps one pending run, and a third `@claude` would cancel the
    # second without an answer. Two answers at once on one branch fail their push, loudly.
    steps:
      # An issue comment runs with the repository's secrets whatever the pull request's origin, and
      # carries no head repository: asked of the API. First, so that a fork's review event, which
      # gets no secret, says why it stops.
      - name: The pull request is not from a fork
        if: github.event.issue.pull_request || github.event.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          if [ "$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json isCrossRepository --jq .isCrossRepository)" != false ]; then
            echo "::error::Pull request #$NUMBER comes from a fork: Claude does not run on it."
            exit 1
          fi
      - name: The subscription token is set
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::The repository secret CLAUDE_CODE_OAUTH_TOKEN is missing: run 'claude setup-token' and add its token under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No --model: the subscription's default model, which follows Claude Code's releases.
      - uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029 # v1.0.239
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --max-turns 30
